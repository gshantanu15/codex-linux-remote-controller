name: Bug report
description: Report a reproducible defect without private data or proprietary binaries.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, keyring exports, app.asar, official native binaries, or unsanitized logs.
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      placeholder: 26.x.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux environment
      description: Distribution, version, desktop, and architecture.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Installation mode
      options:
        - Isolated test copy
        - Official installation
        - Inspection or tests only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact commands and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed tokens, account IDs, device names, local paths, and private task content.
          required: true
        - label: I did not attach proprietary Codex binaries or profile data.
          required: true
        - label: I ran npm test and noted the result above.
          required: true
